name: V6 Release Candidate Gate (non-blocking)

on:
  push:
    branches: [release-candidate-v6-final, stabilization-v6-final]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v6-release-candidate
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v6

      - name: Validate exact release tree
        id: validate
        continue-on-error: true
        run: |
          set -e
          bash -n scripts/build-pages.sh
          bash -n scripts/run-browser-gate.sh
          for f in v6-*.mjs v5-*.mjs tests/e2e*.mjs; do node --check "$f"; done
          node --test tests/*.test.mjs

      - name: Build production artifact
        id: build
        continue-on-error: true
        run: |
          set -e
          bash scripts/build-pages.sh "$GITHUB_SHA" _site
          grep -q "v6-app.mjs?v=${GITHUB_SHA}" _site/index.html
          grep -q "v6-premium-section-inspector.mjs?v=${GITHUB_SHA}" _site/index.html
          grep -q "v6-premium-v3.mjs?v=${GITHUB_SHA}" _site/v5-library.mjs
          grep -q "v6-dnd-precision.mjs?v=${GITHUB_SHA}" _site/v6-reuse.mjs
          grep -q "v6-nav-config.mjs?v=${GITHUB_SHA}" _site/v6-reuse.mjs
          test -f tests/e2e-inspector-stability-v6.mjs
          for f in _site/v6-*.mjs _site/v5-*.mjs; do node --check "$f"; done

      - name: Full production-equivalent browser gate
        id: browser
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -e
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          E2E_HTTP_LOG=/tmp/web-builder-rc-http.log bash scripts/run-browser-gate.sh _site

      - name: Release candidate summary
        if: always()
        run: |
          {
            echo '## V6 release candidate full gate'
            echo ''
            echo '| Stage | Outcome |'
            echo '|---|---|'
            echo '| Checkout | ${{ steps.checkout.outcome }} |'
            echo '| Syntax + model | ${{ steps.validate.outcome }} |'
            echo '| Production artifact | ${{ steps.build.outcome }} |'
            echo '| Exact shared browser gate | ${{ steps.browser.outcome }} |'
            echo ''
            echo 'This workflow is intentionally non-blocking to avoid failed-run notifications. Promote only when every stage reports success.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "RC_FULL checkout=${{ steps.checkout.outcome }} validate=${{ steps.validate.outcome }} build=${{ steps.build.outcome }} browser=${{ steps.browser.outcome }}"
