name: V6 Release Candidate Gate (non-blocking)

on:
  push:
    branches: [release-candidate-v6-final]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v6-release-candidate
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v6

      - name: Validate exact release tree
        id: validate
        continue-on-error: true
        run: |
          set -e
          bash -n scripts/build-pages.sh
          for f in v6-*.mjs v5-*.mjs tests/e2e*.mjs; do node --check "$f"; done
          node --test tests/*.test.mjs

      - name: Build production artifact
        id: build
        continue-on-error: true
        run: |
          set -e
          bash scripts/build-pages.sh "$GITHUB_SHA" _site
          grep -q "v6-app.mjs?v=${GITHUB_SHA}" _site/index.html
          grep -q "v6-premium-section-inspector.mjs?v=${GITHUB_SHA}" _site/index.html
          grep -q "v6-premium-v3.mjs?v=${GITHUB_SHA}" _site/v5-library.mjs
          for f in _site/v6-*.mjs _site/v5-*.mjs; do node --check "$f"; done

      - name: Full production-equivalent browser gate
        id: browser
        continue-on-error: true
        run: |
          set -e
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 4173 --directory _site >/tmp/web-builder-rc-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then READY=1; break; fi
            sleep 1
          done
          test "$READY" -eq 1
          export E2E_BASE_URL=http://127.0.0.1:4173
          node tests/e2e-startup-resilience-v6.mjs
          node tests/e2e.mjs
          node tests/e2e-layout-v6.mjs
          node tests/e2e-deep.mjs
          node tests/e2e-repeatable-v6.mjs
          node tests/e2e-ux-v6.mjs
          node tests/e2e-custom-v6.mjs
          node tests/e2e-site-languages-v6.mjs
          node tests/e2e-theme-v6.mjs
          node tests/e2e-ui-kit-v6.mjs
          node tests/e2e-editor-premium-v6.mjs
          node tests/e2e-premium-v3.mjs
          node tests/e2e-responsive-preview-v6.mjs
          node tests/e2e-functional-v6.mjs
          node tests/e2e-seo-v6.mjs
          node tests/e2e-quality-v6.mjs
          node tests/e2e-advanced-layout-v6.mjs
          node tests/e2e-reuse-v6.mjs
          node tests/e2e-schema-builder-v6.mjs

      - name: Release candidate summary
        if: always()
        run: |
          {
            echo '## V6 release candidate full gate'
            echo ''
            echo '| Stage | Outcome |'
            echo '|---|---|'
            echo '| Checkout | ${{ steps.checkout.outcome }} |'
            echo '| Syntax + model | ${{ steps.validate.outcome }} |'
            echo '| Production artifact | ${{ steps.build.outcome }} |'
            echo '| Full browser matrix | ${{ steps.browser.outcome }} |'
            echo ''
            echo 'This workflow is intentionally non-blocking to avoid failed-run notifications. Promote only when every stage reports success.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "RC_FULL checkout=${{ steps.checkout.outcome }} validate=${{ steps.validate.outcome }} build=${{ steps.build.outcome }} browser=${{ steps.browser.outcome }}"
