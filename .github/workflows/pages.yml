name: Deploy Web Builder v6 to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate v6
        run: |
          set -e
          for f in v5-*.mjs; do node --check "$f"; done
          node --check tests/v6-shell.mjs
          node --check tests/e2e.mjs
          node --check tests/e2e-deep.mjs
          node --test tests/*.test.mjs

      - name: Build v6 Pages artifact
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html v6.css v5-*.mjs .nojekyll _site/
          sed -E -i "s#href=\"v6.css(\?[^\"]*)?\"#href=\"v6.css?v=${GITHUB_SHA}\"#" _site/index.html
          sed -E -i "s#src=\"v5-app.mjs(\?[^\"]*)?\"#src=\"v5-app.mjs?v=${GITHUB_SHA}\"#" _site/index.html
          for f in _site/v5-*.mjs; do
            sed -E -i "s#(from ['\"]\./v5-[^'\"?]+\.mjs)(\?[^'\"]*)?(['\"])#\1?v=${GITHUB_SHA}\3#g" "$f"
          done

      - name: Verify v6 artifact
        run: |
          set -e
          grep -q "Web Builder v6" _site/index.html
          grep -q "v6.css?v=${GITHUB_SHA}" _site/index.html
          grep -q "v5-app.mjs?v=${GITHUB_SHA}" _site/index.html
          if grep -Eq "v5\.css|v5-mobile-fix\.css|enhancements|runtime-fixes|app\.js" _site/index.html; then
            echo "Legacy editor asset found in production index" >&2
            exit 1
          fi
          for f in _site/v5-*.mjs; do node --check "$f"; done

      - name: Browser E2E
        run: |
          set -e
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 4173 --directory _site >/tmp/v6-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/v6-http.log
            exit 1
          fi
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/v6-shell.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-deep.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
