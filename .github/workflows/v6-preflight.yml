name: V6 Preflight

on:
  push:
    branches: [rebuild-v6-production, premium-seo-site-export, fix-production-module-cache, premium-design-system-grid-media]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate syntax and model
        run: |
          set -e
          bash -n scripts/build-pages.sh
          for f in v6-*.mjs v5-*.mjs; do node --check "$f"; done
          node --check tests/e2e.mjs
          node --check tests/e2e-layout-v6.mjs
          node --check tests/e2e-deep.mjs
          node --check tests/e2e-repeatable-v6.mjs
          node --check tests/e2e-ux-v6.mjs
          node --check tests/e2e-custom-v6.mjs
          node --check tests/e2e-site-languages-v6.mjs
          node --check tests/e2e-theme-v6.mjs
          node --check tests/e2e-ui-kit-v6.mjs
          node --check tests/e2e-responsive-preview-v6.mjs
          node --check tests/e2e-functional-v6.mjs
          node --check tests/e2e-seo-v6.mjs
          node --check tests/e2e-design-system-v6.mjs
          node --test tests/*.test.mjs
          node --input-type=module <<'NODE'
          import {preset,makeImageTextGrid,defaultProject,addPageTranslation,pageFile,makeForm} from './v5-model.mjs';
          import {makeCustomSection} from './v6-custom-sections.mjs';
          import {FUNCTIONAL_READY_TYPES,makeFunctionalPreset} from './v6-functional-blocks.mjs';
          const b=preset('imageText');
          const grid=b.root.children.at(-1);
          if(b.name!=='Image + Text') throw new Error('Image + Text block missing');
          if(grid?.props?.repeatTemplate!=='imageText') throw new Error('Repeatable grid missing');
          if(makeImageTextGrid(254).children.length!==254) throw new Error('Manual 254 item count failed');
          if(makeImageTextGrid(999).children.length!==500) throw new Error('500 item cap failed');
          if(makeCustomSection('custom-4').root.children.length!==4) throw new Error('Custom section layout failed');
          if(FUNCTIONAL_READY_TYPES.length!==9||!makeFunctionalPreset('form')||makeForm().props.fields.length<5) throw new Error('Functional block model failed');
          const project=defaultProject(),az=addPageTranslation(project,project.pages[0],'az');
          if(pageFile(az,project)!=='az/index.html') throw new Error('Multilingual page path failed');
          console.log('V6_REPEATABLE_MODEL_OK');
          NODE

      - name: Build exact production artifact
        run: |
          set -e
          bash scripts/build-pages.sh "$GITHUB_SHA" _site
          test -f _site/v5-repeat-controls.mjs
          test -f _site/v5-languages.mjs
          test -f _site/v6-ux.css
          test -f _site/v6-theme.css
          test -f _site/v6-ui-kit.css
          test -f _site/v6-functional.css
          test -f _site/v6-ux.mjs
          test -f _site/v6-custom-sections.mjs
          test -f _site/v6-site-languages.mjs
          test -f _site/v6-responsive-preview.mjs
          test -f _site/v6-functional-blocks.mjs
          test -f _site/v6-functional-inspector.mjs
          test -f _site/v6-functional-public.mjs
          test -f _site/v6-seo.mjs
          test -f _site/v6-design-tokens.mjs
          test -f _site/v6-design-system.mjs
          test -f _site/v6-media-export.mjs
          for f in _site/v6-*.mjs _site/v5-*.mjs; do node --check "$f"; done
          grep -q "v5-repeat-controls.mjs?v=${GITHUB_SHA}" _site/v5-library-extras.mjs
          grep -q "v6-custom-sections.mjs?v=${GITHUB_SHA}" _site/v5-library.mjs
          grep -q "v6-functional-blocks.mjs?v=${GITHUB_SHA}" _site/v5-library.mjs
          grep -q "v6-functional-public.mjs?v=${GITHUB_SHA}" _site/v5-export.mjs
          grep -q "v6-seo.mjs?v=${GITHUB_SHA}" _site/v5-export.mjs
          grep -q "v6-design-tokens.mjs?v=${GITHUB_SHA}" _site/v5-export.mjs
          grep -q "v6-media-export.mjs?v=${GITHUB_SHA}" _site/v5-export.mjs
          grep -q "v6-design-system.mjs?v=${GITHUB_SHA}" _site/v6-app.mjs
          grep -q "v6-design-tokens.mjs?v=${GITHUB_SHA}" _site/v6-design-system.mjs
          grep -q "v5-export.mjs?v=${GITHUB_SHA}" _site/v6-seo.mjs
          grep -q 'Web Builder v6.4' _site/index.html
          grep -q "v6-app.mjs?v=${GITHUB_SHA}" _site/index.html
          grep -q "v6-ux.mjs?v=${GITHUB_SHA}" _site/index.html
          grep -q "v6-site-languages.mjs?v=${GITHUB_SHA}" _site/index.html
          grep -q "v6-responsive-preview.mjs?v=${GITHUB_SHA}" _site/index.html
          grep -q "v6-functional-inspector.mjs?v=${GITHUB_SHA}" _site/index.html
          if grep -q 'src="v5-repeat-controls.mjs"' _site/index.html; then
            echo 'Duplicate direct repeat-controls bootstrap found' >&2
            exit 1
          fi

      - name: Browser regression and UX controls
        run: |
          set -e
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 4173 --directory _site >/tmp/web-builder-v6.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then READY=1; break; fi
            sleep 1
          done
          test "$READY" -eq 1
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-layout-v6.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-deep.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-repeatable-v6.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-ux-v6.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-custom-v6.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-site-languages-v6.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-theme-v6.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-ui-kit-v6.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-responsive-preview-v6.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-functional-v6.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-seo-v6.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-design-system-v6.mjs
