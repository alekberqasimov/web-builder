name: V6 Preflight

on:
  push:
    branches: [rebuild-v6-production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate syntax and model
        run: |
          set -e
          for f in v6-*.mjs v5-*.mjs; do node --check "$f"; done
          node --check tests/e2e.mjs
          node --check tests/e2e-layout-v6.mjs
          node --check tests/e2e-deep.mjs
          node --check tests/e2e-repeatable-v6.mjs
          node --check tests/e2e-ux-v6.mjs
          node --check tests/e2e-custom-v6.mjs
          node --check tests/e2e-site-languages-v6.mjs
          node --check tests/e2e-theme-v6.mjs
          node --check tests/e2e-ui-kit-v6.mjs
          node --test tests/*.test.mjs
          node --input-type=module <<'NODE'
          import {preset,makeImageTextGrid,defaultProject,addPageTranslation,pageFile} from './v5-model.mjs';
          import {makeCustomSection} from './v6-custom-sections.mjs';
          const b=preset('imageText');
          const grid=b.root.children.at(-1);
          if(b.name!=='Image + Text') throw new Error('Image + Text block missing');
          if(grid?.props?.repeatTemplate!=='imageText') throw new Error('Repeatable grid missing');
          if(makeImageTextGrid(254).children.length!==254) throw new Error('Manual 254 item count failed');
          if(makeImageTextGrid(999).children.length!==500) throw new Error('500 item cap failed');
          if(makeCustomSection('custom-4').root.children.length!==4) throw new Error('Custom section layout failed');
          const project=defaultProject(),az=addPageTranslation(project,project.pages[0],'az');
          if(pageFile(az,project)!=='az/index.html') throw new Error('Multilingual page path failed');
          console.log('V6_REPEATABLE_MODEL_OK');
          NODE

      - name: Build branch artifact
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html v6.css v6-ux.css v6-theme.css v6-ui-kit.css v6-*.mjs v5-*.mjs .nojekyll _site/
          test -f _site/v5-repeat-controls.mjs
          test -f _site/v5-languages.mjs
          test -f _site/v6-ux.css
          test -f _site/v6-theme.css
          test -f _site/v6-ui-kit.css
          test -f _site/v6-ux.mjs
          test -f _site/v6-custom-sections.mjs
          test -f _site/v6-site-languages.mjs
          node --check _site/v5-repeat-controls.mjs
          node --check _site/v5-languages.mjs
          node --check _site/v6-ux.mjs
          node --check _site/v6-custom-sections.mjs
          node --check _site/v6-site-languages.mjs
          grep -q "v5-repeat-controls.mjs" _site/v5-library-extras.mjs
          grep -q "v6-custom-sections.mjs" _site/v5-library.mjs
          grep -q 'href="v6-ux.css"' _site/index.html
          grep -q 'href="v6-theme.css"' _site/index.html
          grep -q 'href="v6-ui-kit.css"' _site/index.html
          grep -q 'Web Builder v6.2' _site/index.html
          grep -q 'id="themeToggle"' _site/index.html
          grep -q 'src="v6-ux.mjs"' _site/index.html
          grep -q 'src="v6-site-languages.mjs"' _site/index.html
          if grep -q 'src="v5-repeat-controls.mjs"' _site/index.html; then
            echo 'Duplicate direct repeat-controls bootstrap found' >&2
            exit 1
          fi

      - name: Browser regression and UX controls
        run: |
          set -e
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 4173 --directory _site >/tmp/web-builder-v6.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then READY=1; break; fi
            sleep 1
          done
          test "$READY" -eq 1
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-layout-v6.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-deep.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-repeatable-v6.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-ux-v6.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-custom-v6.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-site-languages-v6.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-theme-v6.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node tests/e2e-ui-kit-v6.mjs
