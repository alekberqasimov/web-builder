<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Web Builder v6.0</title>
  <link rel="stylesheet" href="v6.css">
  <link rel="stylesheet" href="v6-ux.css">
  <style id="v6-critical-responsive">
    .workspace{transition:none}
    @media (max-width:1100px){
      html,body,.app,.topbar,.editor-toolbar,.workspace{width:100%;max-width:100vw;min-width:0}
      .topbar{overflow:hidden;gap:8px;padding-left:10px;padding-right:10px}
      .brand{flex:0 0 auto;min-width:0}.brand-name{font-size:14px}.version{display:none}
      .top-actions{flex:1 1 auto;min-width:0;max-width:100%;overflow-x:auto;overflow-y:hidden;justify-content:flex-end;scrollbar-width:none}
      .top-actions::-webkit-scrollbar{display:none}
      .top-actions .desktop-only{display:none!important}
      .top-actions .has-label::after{display:none}
      .top-actions .icon-action{flex:0 0 40px;width:40px;min-width:40px;padding:0}
      .top-actions select{flex:0 0 60px;width:60px;min-width:60px;padding:0 7px}
    }
    @media (max-width:760px){
      .brand-name{display:block!important;font-size:13px;max-width:92px;overflow:hidden;text-overflow:ellipsis}
      .version{display:none!important}
    }
    @media (max-width:360px){.brand-name{max-width:76px;font-size:12px}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
  <script type="module" src="v6-app.mjs"></script>
  <script type="module" src="v6-ux.mjs"></script>
</head>
<body class="left-collapsed right-collapsed">
<div class="app" id="app">
  <header class="topbar">
    <div class="brand" aria-label="Web Builder">
      <span class="brand-mark">W</span>
      <span class="brand-name">Web Builder</span>
      <span class="version">v6.0</span>
    </div>
    <div class="top-actions" aria-label="Project actions">
      <button class="icon-action" id="undoBtn" type="button" title="Undo" aria-label="Undo">↶</button>
      <button class="icon-action" id="redoBtn" type="button" title="Redo" aria-label="Redo">↷</button>
      <select id="uiLanguage" aria-label="Interface language"><option value="ru">RU</option><option value="az">AZ</option><option value="en">EN</option></select>
      <button class="icon-action has-label desktop-only" id="newBtn" type="button" data-label="Новый проект" title="Новый проект">＋</button>
      <button class="icon-action has-label" id="previewBtn" type="button" data-label="Предпросмотр" title="Предпросмотр">◉</button>
      <button class="icon-action has-label primary" id="downloadBtn" type="button" data-label="Скачать сайт" title="Скачать сайт">⇩</button>
    </div>
  </header>

  <div class="editor-toolbar" role="toolbar" aria-label="Editor controls">
    <button class="panel-toggle has-label" id="leftToggle" type="button" data-label="Блоки" aria-label="Блоки / элементы" aria-expanded="false">☰</button>

    <div class="device-switch" aria-label="Canvas device">
      <button class="active" data-device="desktop" type="button" title="Desktop" aria-label="Desktop">▰</button>
      <button data-device="tablet" type="button" title="Tablet" aria-label="Tablet">▯</button>
      <button data-device="mobile" type="button" title="Mobile" aria-label="Mobile">▯</button>
    </div>

    <div class="custom-width" title="Custom canvas width">
      <input id="customWidth" type="number" min="240" max="1920" inputmode="numeric" placeholder="px" aria-label="Custom width in pixels">
      <small>px</small>
    </div>
    <select id="zoomSelect" aria-label="Canvas zoom"><option value="fit">Fit</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option></select>
    <button class="toolbar-icon" id="guidesBtn" type="button" title="Guides" aria-label="Guides">#</button>

    <button class="panel-toggle has-label" id="rightToggle" type="button" data-label="Настройки" aria-label="Настройки" aria-expanded="false">⚙</button>
  </div>

  <main class="workspace">
    <aside class="sidebar left-sidebar" id="leftSidebar" aria-label="Library">
      <div class="sidebar-head">
        <div><span class="eyebrow">Web Builder</span><h2 id="leftTitle">Блоки</h2></div>
        <button class="sidebar-close" type="button" data-close-panel="left" aria-label="Close blocks panel">×</button>
      </div>
      <div class="tabs left-tabs" role="tablist">
        <button id="blocksTab" class="active" type="button">Блоки</button>
        <button id="elementsTab" type="button">Элементы</button>
        <button id="pagesTab" type="button">Страницы</button>
      </div>
      <div class="panel-scroll">
        <section id="blocksPanel">
          <label class="search"><span>⌕</span><input id="blockSearch" placeholder="Найти блок" autocomplete="off"></label>
          <div class="panel-tools"><select id="blockCategory"><option value="ready">Готовые</option><option value="layouts">Контейнеры</option><option value="my">Мои блоки</option></select></div>
          <div class="library-list" id="blockList"></div>
        </section>
        <section id="elementsPanel" class="hidden">
          <label class="search"><span>⌕</span><input id="elementSearch" placeholder="Найти элемент" autocomplete="off"></label>
          <div class="library-list" id="elementList"></div>
        </section>
        <section id="pagesPanel" class="hidden"><div id="pageList"></div></section>
        <div class="navigator-wrap"><div class="navigator-title"><span>Navigator</span><span>Page tree</span></div><div id="navigatorTree"></div></div>
      </div>
    </aside>

    <section class="stage" aria-label="Canvas">
      <div class="stage-toolbar">
        <div class="page-label" id="pageLabel">Page</div>
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="save-status" id="saveStatus">Saved locally</div>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <div class="canvas-frame desktop" id="canvasFrame"><div class="canvas" id="canvas"></div></div>
      </div>
    </section>

    <aside class="sidebar right-sidebar" id="rightSidebar" aria-label="Inspector">
      <div class="sidebar-head">
        <div><span class="eyebrow">Inspector</span><h2 id="rightTitle">Настройки</h2></div>
        <button class="sidebar-close" type="button" data-close-panel="right" aria-label="Close settings panel">×</button>
      </div>
      <div class="tabs right-tabs" role="tablist">
        <button id="blockTab" class="active" type="button">Блок</button>
        <button id="elementTab" type="button">Элемент</button>
        <button id="pageTab" type="button">Страница</button>
        <button id="seoTab" type="button">SEO</button>
        <button id="siteTab" type="button">Site</button>
      </div>
      <div class="panel-scroll">
        <section id="blockInspector"></section>
        <section id="elementInspector" class="hidden"></section>
        <section id="pageInspector" class="hidden"></section>
        <section id="seoInspector" class="hidden"></section>
        <section id="siteInspector" class="hidden"></section>
      </div>
    </aside>
  </main>
</div>

<div class="panel-backdrop" id="panelBackdrop" aria-hidden="true"></div>

<dialog id="previewDialog" class="preview-dialog">
  <div class="preview-bar"><strong>Preview</strong><select id="previewPage"></select><select id="previewDevice"><option value="desktop">Desktop</option><option value="tablet">Tablet</option><option value="mobile">Mobile</option></select><button id="closePreview" type="button">Close ×</button></div>
  <div class="preview-stage"><iframe id="previewFrame" title="Website preview"></iframe></div>
</dialog>

<div class="context-menu hidden" id="contextMenu"><button data-context="duplicate">Duplicate</button><button data-context="copy">Copy</button><button data-context="copy-style">Copy Style</button><button data-context="paste-style">Paste Style</button><button data-context="delete" class="danger">Delete</button></div>
<div class="toast" id="toast"></div>
</body>
</html>
