<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Web Builder v5.6</title>
  <link rel="stylesheet" href="v5.css">
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
  <script type="module" src="v5-app.mjs"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">W</span><span>Web Builder</span><span class="version">v5.6</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="leftToggle" title="Toggle left panel">◧</button>
      <button class="icon-btn" id="rightToggle" title="Toggle right panel">◨</button>
      <select id="uiLanguage"><option value="ru">RU</option><option value="az">AZ</option><option value="en">EN</option></select>
      <button class="icon-btn" id="undoBtn" title="Undo">↶</button><button class="icon-btn" id="redoBtn" title="Redo">↷</button>
      <button id="newBtn" class="desktop-only">Новый проект</button>
      <button id="previewBtn">Предпросмотр</button>
      <button id="downloadBtn" class="primary">Скачать сайт</button>
    </div>
  </header>
  <main class="workspace">
    <aside class="sidebar left-sidebar">
      <div class="sidebar-head"><span class="eyebrow">Web Builder</span><h2 id="leftTitle">Блоки</h2></div>
      <div class="tabs"><button id="blocksTab" class="active">Блоки</button><button id="elementsTab">Элементы</button><button id="pagesTab">Страницы</button></div>
      <div class="panel-scroll">
        <section id="blocksPanel">
          <label class="search"><span>⌕</span><input id="blockSearch" placeholder="Найти блок"></label>
          <div class="panel-tools"><select id="blockCategory"><option value="ready">Готовые</option><option value="layouts">Контейнеры</option><option value="my">Мои блоки</option></select></div>
          <div class="library-list" id="blockList"></div>
        </section>
        <section id="elementsPanel" class="hidden">
          <label class="search"><span>⌕</span><input id="elementSearch" placeholder="Найти элемент"></label>
          <div class="library-list" id="elementList"></div>
        </section>
        <section id="pagesPanel" class="hidden"><div id="pageList"></div></section>
        <div class="navigator-wrap"><div class="navigator-title"><span>Navigator</span><span>Page tree</span></div><div id="navigatorTree"></div></div>
      </div>
    </aside>
    <section class="stage">
      <div class="stage-toolbar">
        <div class="page-label" id="pageLabel">Page</div><div class="breadcrumb" id="breadcrumb"></div>
        <div class="device-switch"><button class="active" data-device="desktop">▰</button><button data-device="tablet">▯</button><button data-device="mobile">▯</button></div>
        <div class="custom-width"><input id="customWidth" type="number" min="280" max="1920" placeholder="px"><small>custom px</small></div><select id="zoomSelect"><option value="fit">Fit</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option></select><button id="guidesBtn" type="button">#</button>
        <div class="save-status" id="saveStatus">Saved locally</div>
      </div>
      <div class="canvas-wrap"><div class="canvas-frame desktop" id="canvasFrame"><div class="canvas" id="canvas"></div></div></div>
    </section>
    <aside class="sidebar right-sidebar" id="rightSidebar">
      <div class="sidebar-head"><span class="eyebrow">Inspector</span><h2 id="rightTitle">Настройки</h2></div>
      <div class="tabs"><button id="blockTab" class="active">Блок</button><button id="elementTab">Элемент</button><button id="pageTab">Страница</button><button id="seoTab">SEO</button><button id="siteTab">Site</button></div>
      <div class="panel-scroll">
        <section id="blockInspector"></section><section id="elementInspector" class="hidden"></section><section id="pageInspector" class="hidden"></section><section id="seoInspector" class="hidden"></section><section id="siteInspector" class="hidden"></section>
      </div>
    </aside>
  </main>
</div>
<dialog id="previewDialog" class="preview-dialog">
  <div class="preview-bar"><strong>Preview</strong><select id="previewPage"></select><select id="previewDevice"><option value="desktop">Desktop</option><option value="tablet">Tablet</option><option value="mobile">Mobile</option></select><button id="closePreview">Close ×</button></div>
  <div class="preview-stage"><iframe id="previewFrame" title="Website preview"></iframe></div>
</dialog>
<div class="context-menu hidden" id="contextMenu"><button data-context="duplicate">Duplicate</button><button data-context="copy">Copy</button><button data-context="copy-style">Copy Style</button><button data-context="paste-style">Paste Style</button><button data-context="delete" class="danger">Delete</button></div><div class="toast" id="toast"></div>
</body>
</html>
