  <script>
    (function(){
      var KEY='wb:v6.5:theme';
      var root=document.documentElement;
      var labels={
        ru:{dark:'Тёмная тема',light:'Светлая тема',toDark:'Включить тёмную тему',toLight:'Включить светлую тему'},
        az:{dark:'Tünd mövzu',light:'Açıq mövzu',toDark:'Tünd mövzunu aktiv et',toLight:'Açıq mövzunu aktiv et'},
        en:{dark:'Dark theme',light:'Light theme',toDark:'Switch to dark theme',toLight:'Switch to light theme'}
      };
      function stored(){try{return localStorage.getItem(KEY)}catch(e){return null}}
      function save(v){try{localStorage.setItem(KEY,v)}catch(e){}}
      function preferred(){var v=stored();if(v==='light'||v==='dark')return v;return 'light'}
      function language(){var el=document.getElementById('uiLanguage');return (el&&el.value)||root.lang||'ru'}
      function syncControl(theme){
        var btn=document.getElementById('themeToggle');if(!btn)return;
        var lang=String(language()).slice(0,2),copy=labels[lang]||labels.en;
        btn.dataset.theme=theme;
        btn.textContent=theme==='light'?'☀':'☾';
        btn.title=theme==='light'?copy.toDark:copy.toLight;
        btn.setAttribute('aria-label',btn.title);
        btn.setAttribute('aria-pressed',String(theme==='dark'));
        btn.dataset.label=theme==='light'?copy.light:copy.dark;
      }
      function apply(theme,persist){
        theme=theme==='light'?'light':'dark';
        root.dataset.builderTheme=theme;
        root.style.colorScheme=theme;
        var meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=theme==='light'?'#f5f7fb':'#0b1020';
        if(persist)save(theme);
        syncControl(theme);
        return theme;
      }
      window.wbBuilderTheme={
        apply:function(theme){return apply(theme,true)},
        toggle:function(){return apply(root.dataset.builderTheme==='light'?'dark':'light',true)},
        current:function(){return root.dataset.builderTheme||preferred()}
      };
      apply(preferred(),false);
      document.addEventListener('DOMContentLoaded',function(){
        apply(root.dataset.builderTheme||preferred(),false);
        var btn=document.getElementById('themeToggle');if(btn)btn.addEventListener('click',function(){window.wbBuilderTheme.toggle()});
        var ui=document.getElementById('uiLanguage');if(ui)ui.addEventListener('change',function(){syncControl(root.dataset.builderTheme||'light')});
      },{once:true});
    })();
  </script>
